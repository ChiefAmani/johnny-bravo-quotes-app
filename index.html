<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny Bravo Quotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Johnny Bravo Quotes</h1>
        <div class="quote-display" id="quote-display">
            Loading a cool quote...
        </div>
        <div class="controls">
            <button id="random-quote-btn">Get Random Quote</button>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for quotes...">
            <button id="search-btn">Search</button>
        </div>
        <div class="search-results" id="search-results">
            <!-- Search results will appear here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
